<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temperature Converter</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f2f2f2; }
        .box { background: #fff; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select, button { margin: 10px 0; padding: 8px; width: 90%; }
    </style>
</head>
<body>

<div class="box">
    <h2>Temp Converter</h2>
    <input type="number" id="temp" placeholder="Enter Temperature"><br>
    <select id="unit">
        <option value="c">Celsius to Fahrenheit</option>
        <option value="f">Fahrenheit to Celsius</option>
    </select><br>
    <button onclick="convert()">Convert</button>
    <h3 id="res"></h3>
</div>

<script>
    function convert() {
        let t = parseFloat(document.getElementById("temp").value);
        let u = document.getElementById("unit").value;
        let r = document.getElementById("res");

        if (isNaN(t)) { r.innerHTML = "Enter a valid number"; return; }

        if (u === "c") {
            r.innerHTML = `${t}°C = ${(t * 9/5 + 32).toFixed(2)}°F`;
        } else {
            r.innerHTML = `${t}°F = ${((t - 32) * 5/9).toFixed(2)}°C`;
        }
    }
</script>

</body>
</html>
